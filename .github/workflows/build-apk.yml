name: Build Android APK

# ── 触发方式：发布一个 Release ──
# 本仓不再保存 web/ 与 libvantaloom.so（那是私仓的编译产物，每个版本几十 MB，
# 二进制无法 delta 压缩，曾把 .git 撑到 734MB）。改为：
#   1. 维护者在 GitHub 上建 draft Release（tag = vX.Y.Z）
#   2. 往 draft 里上传产物：web.tar.zst + libvantaloom.so
#   3. 点 Publish —— 这一步就是"开始构建"的信号
#   4. CI 从**同一个 Release** 下载产物，构建 APK/IPA，再把成品传回这个 Release
# 最后 vX.Y.Z 一个 Release 里同时有产物与成品，版本号只有一个真源（tag）。
#
# 为什么不是 push 触发：产物不在 git 里了，push 没有可比对的变化；而"发布
# Release"本身就是维护者明确的放行信号，比任何路径过滤都准确。
on:
  release:
    # 只在"发布"那一刻触发一次。刻意不接 edited:  CI 会往同一个 Release 上传
    # APK，若接 edited 就会自触发成死循环。
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已有 Release 的 tag（例如 v0.21.0），手动补建产物时用"
        required: true
        type: string

concurrency:
  group: build-apk-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # 产物已在 Release 里，这条流水线只剩 gomobile bind + 解包 web + Gradle。
    timeout-minutes: 45
    permissions:
      contents: write # 把 APK 传回本 Release
    env:
      # arm64 covers essentially every real phone.
      GOMOBILE_TARGET: android/arm64
      ANDROID_API: "24"
      NDK_VER: "26.0.10792818"
      X_MOBILE_VERSION: "v0.0.0-20260709172247-6129f5bee9d5"
      AAR_OUT: android/app/libs/loomnet.aar
      # Precompiled proot sandbox kernel (Termux upstream, pinned by SHA256).
      # These run the downloaded Linux rootfs without root; see runtime-engines
      # is gone, sandbox is proot + Ubuntu Base pulled at runtime.
      # NOTE: the Termux pool keeps ONLY the newest build of each package — a
      # proot version bump upstream 404s the pinned URL and this job fails loud
      # (2026-07-21: .85 → .86; 2026-07-27: .86 → .87). Re-pin: list
      # https://packages.termux.dev/apt/termux-main/pool/main/p/proot/ , download,
      # sha256sum, verify the data.tar layout still has bin/proot + libexec/proot/
      # loader{,32}, then update BOTH values below.
      # ⚠️ Termux 的 pool **每个包只保留最新一版**，所以这些钉子平均几周就会 404
      # （5.1.107.85 -> .86 -> .90 -> .91 已经咬过四次）。下面的 fetch_deb 会在钉子
      # 取不到时退到仓库自己的 Packages 索引，用**索引里的 SHA256** 校验后继续，
      # 并打一条 ::warning:: 报出新版本号——看到告警就回来把钉子刷新一次。
      PROOT_DEB_URL: "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.1.107.96_aarch64.deb"
      PROOT_DEB_SHA256: "8199dca06dccb693ec09fb1759e3e1ad08b4863f0c11c612f89c20bd9ecdc1a0"
      TALLOC_DEB_URL: "https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/libtalloc_2.5.0_aarch64.deb"
      TALLOC_DEB_SHA256: "556591f43bb773ad8777e1a29522640866a55f95dab71914418b94a8c58ad5a7"
      SHMEM_DEB_URL: "https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/libandroid-shmem_0.7_aarch64.deb"
      SHMEM_DEB_SHA256: "0da3a24d558b93c92bcf8d611e0826a99ff96e396b148e6cdf33b47c47c57ff6"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            mobile-src/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 不能用 action 的默认 packages（"tools platform-tools"）：
          # 旧的 SDK Tools 包 "tools" 已被 Google 从仓库下架，新版 cmdline-tools
          # 解析不到它就 sdkmanager exit 1，整个构建死在第 5 步。下一步本来就会
          # 显式装 platform-tools / NDK / platform / build-tools，这里只要它别去
          # 要那个不存在的包。
          packages: platform-tools

      - name: Install Android NDK + platform + build-tools
        run: |
          set -euo pipefail
          sdkmanager "ndk;${NDK_VER}" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/${NDK_VER}"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install packaging prerequisites
        run: |
          set -euo pipefail
          # patchelf 与 unzip 在 ubuntu runner 镜像里本来就有 —— 这一步的 apt 日志
          # 恒为 "0 upgraded, 0 newly installed"。也就是说它平时什么也不做，只在
          # runner 的默认 apt 镜像（azure.archive.ubuntu.com）抽风时，把整条流水线
          # 卡十几分钟：mirrorlist 把 azure 排在 archive.ubuntu.com 前面，每个索引
          # 都要先耗完连接超时 + 重试才轮到兜底镜像（日志里成片的 Ign: 就是它）。
          # 所以：先探，缺了才装；真要装也把挂掉的镜像摘掉并收紧超时。
          missing=()
          command -v patchelf >/dev/null 2>&1 || missing+=(patchelf)
          command -v unzip    >/dev/null 2>&1 || missing+=(unzip)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "patchelf / unzip 已在 runner 镜像中，跳过 apt"
            exit 0
          fi
          echo "缺少：${missing[*]}——走 apt 安装"
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
          sudo apt-get install --no-install-recommends -y "${missing[@]}"

      - name: Test the WebView bridge contract
        run: node --test android/app/src/test/js/bridge-shim.test.mjs

      # ── 从本 Release 下载私仓产物 ──
      # 维护者发布 Release 时上传两个资产：
      #   libvantaloom.so   私仓 apps/api 的 Go 交叉编译产物（约 82MB）
      #   web.tar.zst       私仓 apps/vantaloom 的 Next.js 静态导出（约 47MB → 压缩后更小）
      # 两者都不进 git。版本号即 Release tag，不再需要单独的 lock/VERSION 文件。
      - name: Verify the release carries the required artifacts
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          [ -n "$TAG" ] || { echo "ERROR: 取不到 tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 版本号 = tag 去掉前缀 v（v0.21.0 → 0.21.0）。gradle 的 versionName 用它。
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "VANTALOOM_VERSION=$VER" >> "$GITHUB_ENV"
          # 缺哪个就明确报出来，别等到 gradle 阶段才报一句看不懂的错。
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "Release $TAG 资产："; printf '%s\n' "$names"
          for need in libvantaloom.so web.tar.zst; do
            printf '%s\n' "$names" | grep -Fxq "$need" || {
              echo "ERROR: Release $TAG 缺少资产 $need（发布 Release 前必须先上传它）" >&2; exit 1; }
          done

      - name: Download libvantaloom.so from this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          JNI="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          gh release download "$TAG" --pattern libvantaloom.so --dir "$JNI" --clobber
          test -s "$JNI/libvantaloom.so" || { echo "ERROR: 下载后文件为空" >&2; exit 1; }
          # 打印 sha256 到日志：想核对某次构建用的是哪个二进制，查这里即可。
          echo "libvantaloom.so sha256: $(sha256sum "$JNI/libvantaloom.so" | cut -d' ' -f1)"
          echo "libvantaloom.so 大小: $(du -h "$JNI/libvantaloom.so" | cut -f1)"

      - name: Download and unpack web export from this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          gh release download "$TAG" --pattern web.tar.zst --dir "$RUNNER_TEMP" --clobber
          rm -rf web
          mkdir -p web
          # --zstd 必须显式给：runner 的 tar 不一定默认认 zst。
          tar --zstd -xf "$RUNNER_TEMP/web.tar.zst" -C web
          # 允许归档里带一层顶层目录（web/... 或 out/...），展开成 web/index.html。
          if [ ! -f web/index.html ]; then
            inner="$(find web -maxdepth 2 -name index.html -printf '%h' -quit)"
            if [ -n "$inner" ] && [ "$inner" != "web" ]; then
              shopt -s dotglob
              mv "$inner"/* web/
              rmdir "$inner" 2>/dev/null || true
            fi
          fi
          [ -f web/index.html ] || { echo "ERROR: web.tar.zst 里找不到 index.html" >&2; exit 1; }
          echo "web/ 解包完成：$(find web -type f | wc -l) 个文件，$(du -sh web | cut -f1)"

      - name: Stage the proot sandbox kernel into jniLibs
        run: |
          set -euo pipefail
          JNI="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          WORK="$RUNNER_TEMP/proot-stage"
          mkdir -p "$WORK"

          TERMUX_INDEX_URL="https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages"
          TERMUX_POOL_BASE="https://packages.termux.dev/apt/termux-main"
          # 索引落到固定路径而不是变量缓存：resolve_from_index 的调用点是
          # `line="$(resolve_from_index ...)"`，命令替换是**子 shell**，函数里给
          # 变量赋的值传不回来 —— 用变量缓存等于每个包都重下一遍索引（实测）。
          TERMUX_INDEX="$RUNNER_TEMP/termux-Packages"

          # resolve_from_index <包名> -> "<pool 相对路径> <sha256> <版本>"
          # Termux 的 Packages 索引就是 apt 自己用的那份，带每个包的 SHA256。
          resolve_from_index() {
            local pkg="$1"
            [ -s "$TERMUX_INDEX" ] || curl -fsSL --retry 3 --retry-delay 2 -o "$TERMUX_INDEX" "$TERMUX_INDEX_URL"
            awk -v pkg="$pkg" '
              { sub(/\r$/, "") }
              $0 == "Package: " pkg { inpkg = 1; next }
              inpkg && /^Version: /  { ver = $2 }
              inpkg && /^Filename: / { fn  = $2 }
              inpkg && /^SHA256: /   { sha = $2 }
              # ⚠️ awk 的 exit **会跑 END 块**——END 不看 done 标志就会把同一行打两遍，
              #    调用方 cut 出来的就是两行，URL 当场拼坏（本地实测过）。
              inpkg && /^$/ { if (fn != "" && sha != "") { print fn, sha, ver; done = 1 } exit }
              END { if (!done && inpkg && fn != "" && sha != "") print fn, sha, ver }
            ' "$TERMUX_INDEX"
          }

          # 先走钉死的 URL+SHA（可复现路径）；取不到就退到索引，**仍然校验**
          # （用索引给出的 SHA256），绝不是跳过校验。
          fetch_deb() {
            local pkg="$1" url="$2" sha="$3" out="$4"
            if curl -fsSL --retry 3 --retry-delay 2 -o "$out" "$url" 2>/dev/null \
               && echo "$sha  $out" | sha256sum -c - >/dev/null 2>&1; then
              echo "· $pkg: 钉死版本 OK ($url)"
              return 0
            fi
            echo "::warning::$pkg 的钉死版本取不到或校验不过（Termux pool 只保留最新一版）；改用索引里的当前版本继续，请回 workflow 刷新 URL/SHA 钉子。"
            local line fn isha iver
            line="$(resolve_from_index "$pkg")"
            if [ -z "$line" ]; then
              echo "::error::Termux 索引里也找不到 $pkg —— 上游可能改名或下架，需要人工处理。"
              return 1
            fi
            fn="$(echo "$line" | cut -d" " -f1)"
            isha="$(echo "$line" | cut -d" " -f2)"
            iver="$(echo "$line" | cut -d" " -f3)"
            echo "::warning::$pkg 索引当前版本 = $iver；URL=$TERMUX_POOL_BASE/$fn；SHA256=$isha"
            curl -fsSL --retry 3 --retry-delay 2 -o "$out" "$TERMUX_POOL_BASE/$fn"
            echo "$isha  $out" | sha256sum -c -
          }
          extract_deb_data() {
            # deb = ar(debian-binary, control.tar.*, data.tar.*); unpack data.
            local deb="$1" dest="$2"
            mkdir -p "$dest"
            ( cd "$dest" && ar x "$deb" && tar -xf data.tar.* )
          }

          fetch_deb proot            "$PROOT_DEB_URL"  "$PROOT_DEB_SHA256"  "$WORK/proot.deb"
          fetch_deb libtalloc        "$TALLOC_DEB_URL" "$TALLOC_DEB_SHA256" "$WORK/talloc.deb"
          fetch_deb libandroid-shmem "$SHMEM_DEB_URL"  "$SHMEM_DEB_SHA256"  "$WORK/shmem.deb"
          extract_deb_data "$WORK/proot.deb" "$WORK/proot"
          extract_deb_data "$WORK/talloc.deb" "$WORK/talloc"
          extract_deb_data "$WORK/shmem.deb" "$WORK/shmem"

          PREFIX="data/data/com.termux/files/usr"
          cp "$WORK/proot/$PREFIX/bin/proot"               "$JNI/libproot.so"
          cp "$WORK/proot/$PREFIX/libexec/proot/loader"    "$JNI/libproot_loader.so"
          cp "$WORK/proot/$PREFIX/libexec/proot/loader32"  "$JNI/libproot_loader32.so"
          cp "$WORK/talloc/$PREFIX/lib/"libtalloc.so.2.* "$JNI/libtalloc.so"
          cp "$WORK/shmem/$PREFIX/lib/libandroid-shmem.so" "$JNI/libandroid_shmem.so"
          chmod 0755 "$JNI"/libproot*.so "$JNI"/libtalloc.so "$JNI"/libandroid_shmem.so

          # The Termux proot links its deps by versioned/dashed sonames and an
          # $PREFIX rpath that does not exist off-Termux. Repoint the DT_NEEDED
          # to the extractable lib*.so names and search $ORIGIN (nativeLibraryDir);
          # libc.so is resolved by the system linker. The runtime sets
          # PROOT_LOADER to the staged loader so proot never needs $PREFIX.
          patchelf --replace-needed libtalloc.so.2 libtalloc.so "$JNI/libproot.so"
          patchelf --replace-needed libandroid-shmem.so libandroid_shmem.so "$JNI/libproot.so"
          patchelf --set-rpath '$ORIGIN' "$JNI/libproot.so"
          echo "Staged proot sandbox kernel:"
          ls -la "$JNI"

      - name: Install gomobile + gobind
        run: |
          set -euo pipefail
          go install "golang.org/x/mobile/cmd/gomobile@${X_MOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${X_MOBILE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        run: gomobile init

      - name: Bind the loomnet overlay facade → AAR
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$AAR_OUT")"
          pushd mobile-src
          go get "golang.org/x/mobile/bind@${X_MOBILE_VERSION}"
          gomobile bind \
            -target="${GOMOBILE_TARGET}" \
            -androidapi "${ANDROID_API}" \
            -javapkg=online.timefiles \
            -o "${GITHUB_WORKSPACE}/${AAR_OUT}" \
            ./mobile
          popd
          ls -la "$AAR_OUT"

      - name: Stage the compiled web export into app assets
        run: |
          set -euo pipefail
          if [ ! -f web/index.html ]; then
            echo "ERROR: web/ 解包后没有 index.html" >&2; exit 1
          fi
          # 产物门禁：Release 里的 web.tar.zst 由私仓构建，绝不能夹带源码或
          # sourcemap（.map 的 sourcesContent 会把专有源码整份带出来）。
          forbidden_web_files="$(find web -type f \( -name '*.map' -o -name '*.ts' -o -name '*.tsx' -o -name '*.jsx' \) -print)"
          if [ -n "$forbidden_web_files" ]; then
            echo "ERROR: web 产物包含源码/sourcemap，拒绝构建：" >&2
            printf '%s\n' "$forbidden_web_files" >&2
            exit 1
          fi
          mkdir -p android/app/src/main/assets
          rm -f android/app/src/main/assets/README.md
          cp -r web/. android/app/src/main/assets/
          echo "Staged $(find android/app/src/main/assets -type f | wc -l) web files."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test Android native runtime contracts
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble release APK (unsigned)
        working-directory: android
        timeout-minutes: 30
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            -PversionName="${VANTALOOM_VERSION}"

      - name: Assert the web bundle survived AAPT (assets/_next present)
        run: |
          set -euo pipefail
          # AAPT's default ignore pattern drops `_*` asset DIRECTORIES — with it,
          # index.html ships but every /_next/ chunk 404s and the app freezes on
          # the prerendered spinner (build136 regression). build.gradle.kts
          # overrides ignoreAssetsPattern; this step makes any regression fail
          # the build loudly instead of shipping a bricked APK.
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          NEXT_COUNT="$(unzip -l "$APK" | grep -c 'assets/_next/' || true)"
          TOTAL_ASSETS="$(unzip -l "$APK" | grep -c 'assets/' || true)"
          echo "assets entries: $TOTAL_ASSETS, assets/_next entries: $NEXT_COUNT"
          if [ "$NEXT_COUNT" -lt 10 ]; then
            echo "ERROR: assets/_next/ missing or nearly empty ($NEXT_COUNT entries) — the web JS bundle did not make it into the APK."
            exit 1
          fi

      - name: Assert native binaries survived APK packaging
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_ENTRIES="$RUNNER_TEMP/vantaloom-apk-entries.txt"
          unzip -Z1 "$APK" > "$APK_ENTRIES"
          for entry in \
            lib/arm64-v8a/libvantaloom.so \
            lib/arm64-v8a/libgojni.so \
            lib/arm64-v8a/libproot.so \
            lib/arm64-v8a/libproot_loader.so \
            lib/arm64-v8a/libtalloc.so \
            lib/arm64-v8a/libandroid_shmem.so; do
            if ! grep -Fxq "$entry" "$APK_ENTRIES"; then
              echo "ERROR: required native entry is missing from APK: $entry"
              exit 1
            fi
          done
          echo "All required native binaries are present in the APK."

      - name: Sign release APK (keystore from GitHub secrets)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: SIGNING_KEYSTORE_BASE64 secret is not set. See signing/README.md."; exit 1
          fi
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          KS="$RUNNER_TEMP/release.jks"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KS"

          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            echo "ERROR: unsigned release APK not found:"; find android/app/build/outputs -name '*.apk' || true; exit 1
          fi

          ALIGNED="$RUNNER_TEMP/vantaloom-release-aligned.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" \
            --ks-pass "pass:${SIGNING_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${SIGNING_KEY_ALIAS}" \
            --key-pass "pass:${SIGNING_KEY_PASSWORD}" \
            "$ALIGNED"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$ALIGNED"

          mkdir -p dist
          SHA="$(git rev-parse --short HEAD)"
          NAME="vantaloom-build${GITHUB_RUN_NUMBER}-${SHA}.apk"
          cp "$ALIGNED" "dist/$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Signed: dist/$NAME"; ls -la dist


      # ── 把 APK 传回触发本次构建的那个 Release ──
      # 不再新建 Release：tag 就是维护者发布时创建的那个 vX.Y.Z。iOS 构建同样
      # 往这里追加，所以一个版本最终只有一处，里面既有产物也有双平台成品。
      # 传资产不会再次触发本 workflow（只监听 published），不会递归。
      - name: Upload APK back to the triggering release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          APK="dist/${APK_NAME}"
          ls -la dist
          gh release upload "$TAG" "$APK" --clobber
          echo "已上传 $APK 到 Release $TAG"
          gh release view "$TAG" --json url --jq '.url'

